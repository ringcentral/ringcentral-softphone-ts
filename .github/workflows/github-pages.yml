name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r mkdocs/requirements.txt
      - name: Enforce Softphone SDK naming
        run: |
          if git grep -niE 'cloud[ _-]*phone' -- README.md mkdocs; then
            echo "Use Softphone SDK naming in documentation."
            exit 1
          fi
      - name: Build documentation
        run: mkdocs build --strict -f mkdocs/mkdocs.yml --site-dir "${RUNNER_TEMP}/mkdocs-site"

  deploy:
    if: github.event_name == 'push'
    needs: docs
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r mkdocs/requirements.txt
      - name: Deploy documentation
        run: mkdocs gh-deploy --force -f mkdocs/mkdocs.yml
